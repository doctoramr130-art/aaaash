<script>
  // محمّل مكتبات بيجرب أكتر من مصدر (CDN) لكل مكتبة: لو المصدر الأول (unpkg)
  // اتأخر أكتر من 7 ثواني أو فشل، بيتحول تلقائيًا للمصدر البديل (jsDelivr)
  // من غير ما المستخدم يعمل أي حاجة. ده بيحل مشاكل شبكات النت المتقطعة أو
  // اللي بتحجب CDN معين مؤقتًا.
  function aashLoadScript(urls, timeoutMs) {
    return new Promise((resolve, reject) => {
      let i = 0;
      function tryNext() {
        if (i >= urls.length) { reject(new Error("all sources failed: " + urls[0])); return; }
        const url = urls[i++];
        const s = document.createElement("script");
        s.src = url;
        let done = false;
        const timer = setTimeout(() => { if (!done) { done = true; s.remove(); tryNext(); } }, timeoutMs || 7000);
        s.onload = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
        s.onerror = () => { if (!done) { done = true; clearTimeout(timer); s.remove(); tryNext(); } };
        document.head.appendChild(s);
      }
      tryNext();
    });
  }

  async function aashBoot() {
    try {
      await aashLoadScript([
        "https://unpkg.com/react@18/umd/react.production.min.js",
        "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js",
      ]);
      await aashLoadScript([
        "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
        "https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js",
      ]);
      await aashLoadScript([
        "https://unpkg.com/@babel/standalone/babel.min.js",
        "https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js",
      ]);
      const code = document.getElementById("aash-app-source").textContent;
      const transformed = Babel.transform(code, { presets: ["react"] }).code;
      (0, eval)(transformed);
    } catch (err) {
      window.__aashLoadError = err;
    }
  }
  aashBoot();
</script>

<script type="text/plain" id="aash-app-source">
const { useState, useEffect, useRef, useCallback } = React;

const C = {
  bg: "#141210", surface: "#1E1B17", surfaceAlt: "#2A251E", border: "#3D362B",
  text: "#F3EEE3", textMuted: "#A39A8B", gold: "#E0AC4F", rust: "#C1512E", ink: "#181410",
};
const DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const HYPE = ["عاش! 💪", "وحش! 🔥", "تحفة كده! 👊", "كملها كده!", "نار! 🔥", "أسد يا وحش! 🦁", "جامد أوي!"];
function pickHype() { return HYPE[Math.floor(Math.random() * HYPE.length)]; }
const DHIKR = ["سبحان الله 🤍", "الحمد لله 🤍", "الله أكبر 🤍", "لا إله إلا الله 🤍", "أستغفر الله 🤍", "لا حول ولا قوة إلا بالله 🤍"];
function estOneRM(weight, reps) { return weight * (1 + reps / 30); }
function suggestNextWeight(weight, reps, targetReps) {
  const step = weight >= 40 ? 2.5 : 1.25;
  if (reps >= targetReps + 2) return weight + step * 2;
  if (reps >= targetReps) return weight + step;
  return weight;
}
function buzz(pattern) { if (navigator.vibrate) try { navigator.vibrate(pattern); } catch (e) {} }
let cachedVoice = null, voiceSearched = false;
function pickArabicMaleVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  const arabicVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
  if (!arabicVoices.length) return null;
  const maleHints = ["male", "naayf", "majed", "tarik", "hamed", "abdullah", "khalid", "faisal", "rashid"];
  const femaleHints = ["female", "hoda", "zariyah", "salma", "amira", "laila", "reem", "fatima"];
  const male = arabicVoices.find(v => maleHints.some(h => v.name.toLowerCase().includes(h)));
  if (male) return male;
  const notFemale = arabicVoices.find(v => !femaleHints.some(h => v.name.toLowerCase().includes(h)));
  return notFemale || arabicVoices[0];
}
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}]/gu, "").trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "ar-SA"; u.rate = 0.95; u.volume = 0.8; u.pitch = 0.85;
    if (!cachedVoice && !voiceSearched) { cachedVoice = pickArabicMaleVoice(); voiceSearched = true; }
    if (cachedVoice) u.voice = cachedVoice;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
if (typeof window !== "undefined" && "speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickArabicMaleVoice(); voiceSearched = true; };
}
function greeting() {
  const h = new Date().getHours();
  if (h < 6) return "سهرانين للنهاردة؟ 🌙";
  if (h < 12) return "صباح الأبطال ☀️";
  if (h < 17) return "يلا نكسر النهاردة 💪";
  if (h < 21) return "وقت الجدية 🔥";
  return "تمرين بالليل نار 🌙";
}

function todayKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return todayKey(d);
}
function fmtClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

// ---- local storage (real, synchronous, works fully offline) ----
function loadState() {
  try {
    const raw = localStorage.getItem("aashData");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { customExercises: [], plan: {}, logs: [], sessionHistory: [], programId: null, activeSessionStart: null, restDuration: 90, bodyWeights: [], soundEnabled: true, exerciseNotes: {}, dhikrEnabled: true };
}
function saveState(s) {
  try { localStorage.setItem("aashData", JSON.stringify(s)); } catch (e) { console.error(e); }
}
let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.18, 0.36].forEach((offset, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = i < 2 ? 880 : 1175;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + offset); osc.stop(now + offset + 0.16);
    });
  } catch (e) {}
}

    a.href = url; a.download = "aash-backup-" + todayKey() + ".json";

      </div>

}

function calcPlates(target, barWeight) {
  let perSide = (target - barWeight) / 2;
  if (perSide < 0) perSide = 0;
  const plateSizes = [25, 20, 15, 10, 5, 2.5, 1.25];
  let remaining = perSide;
  const breakdown = [];
  plateSizes.forEach(p => {
    const count = Math.floor(remaining / p + 1e-9);
    if (count > 0) { breakdown.push({ plate: p, count }); remaining -= count * p; }
  });
  return { breakdown, perSide, leftover: remaining };
}

                  {loggedNames.has(ex.name) ? "تم" : ex.sets+" سيت"}
                </span>
              </div>
            ))}
          </div>
        )}
        <button onClick={() => setTab("workout")} className="cairo" style={{ marginTop:16, width:"100%", padding:"14px 0", borderRadius:14, background:"linear-gradient(135deg, #F0C875, "+C.gold+")", color:C.ink, fontWeight:900, fontSize:16, boxShadow:"0 6px 18px rgba(224,172,79,.35)" }}>
          ابدأ التمرين ‹
        </button>
      </Card>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        <Card style={{ padding:16 }}>
          <div style={{ fontSize:18 }}>🔥</div>
          <div className="cairo" style={{ fontWeight:900, fontSize:24, marginTop:8 }}>{streak}</div>
          <div style={{ fontSize:12, color:C.textMuted, marginTop:2 }}>أيام متتالية</div>
        </Card>
        <Card style={{ padding:16 }}>
          <div style={{ fontSize:18 }}>🏆</div>
          <div className="cairo" style={{ fontWeight:900, fontSize:24, marginTop:8 }}>{lastSession ? lastSession.minutes+" د" : "—"}</div>
          <div style={{ fontSize:12, color:C.textMuted, marginTop:2 }}>آخر تمرين</div>
        </Card>
      </div>
      {totalSessions > 0 && (
        <Card style={{ padding:16 }}>
          <div className="cairo" style={{ fontWeight:700, fontSize:13, color:C.gold, marginBottom:10 }}>إحصائياتك الكلية</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <div>
              <div className="cairo" style={{ fontWeight:900, fontSize:20 }}>{totalSessions}</div>
              <div style={{ fontSize:11, color:C.textMuted }}>تمرين كامل</div>
            </div>
            <div>
              <div className="cairo" style={{ fontWeight:900, fontSize:20 }}>{Math.round(totalVolume).toLocaleString("ar-EG")}</div>
              <div style={{ fontSize:11, color:C.textMuted }}>كجم إجمالي مرفوع</div>
            </div>
          </div>
        </Card>
      )}
      {milestone && (
        <div className="cairo" style={{ textAlign:"center", fontSize:13, fontWeight:700, color:C.gold, background:C.surfaceAlt, padding:"10px 0", borderRadius:12 }}>
          {milestone}
        </div>
      )}
    </div>
  );
}

function NumPad({ value, onChange, allowDot }) {
  const tap = (k) => {
    if (k === "back") return onChange(value.slice(0, -1));
    if (k === "." && (value.includes(".") || !allowDot)) return;
    if (value.length >= 5) return;
    onChange(value + k);
  };
  const keys = ["1","2","3","4","5","6","7","8","9", allowDot?".":"0", "0", "back"];
  return (
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6 }}>
      {keys.map((k,i) => (
        <button key={i} onClick={() => tap(k)} className="cairo" style={{ padding:"10px 0", borderRadius:8, background:C.surfaceAlt, border:"1px solid "+C.border, fontWeight:700, fontSize:16 }}>
          {k === "back" ? "⌫" : k}
        </button>
      ))}
    </div>
  );
}

function ExerciseNote({ value, onSave }) {
  const [text, setText] = useState(value);
  return (
    <Card style={{ padding:14 }}>
      <textarea value={text} onChange={e => setText(e.target.value)} placeholder="مثلاً: خفّف على الكتف الشمال، أو نزّل البار لحد نص الصدر بس"
        style={{ width:"100%", minHeight:64, borderRadius:10, padding:10, fontSize:13, background:C.surfaceAlt, color:C.text, border:"1px solid "+C.border, resize:"vertical", fontFamily:"inherit" }} />
      <button onClick={() => onSave(text)} className="cairo" style={{ width:"100%", marginTop:8, padding:"8px 0", borderRadius:10, background:C.gold, color:C.ink, fontWeight:700, fontSize:13 }}>حفظ الملاحظة</button>
    </Card>
  );
}

function WorkoutTab({ state, persist, allExercises, showToast }) {
  const today = todayKey();
  const todaysPlan = state.plan[new Date().getDay()] || [];
  const [selected, setSelected] = useState(() => todaysPlan[0] ? todaysPlan[0].name : (allExercises[0] || ""));
  const [weightStr, setWeightStr] = useState("");
  const [repsStr, setRepsStr] = useState("");
  const [isWarmup, setIsWarmup] = useState(false);
  const [restLeft, setRestLeft] = useState(0);
  const restTotal = state.restDuration || 90;
  const [prompt, setPrompt] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [showAll, setShowAll] = useState(todaysPlan.length === 0);
  const [editingIndex, setEditingIndex] = useState(null);
  const [showPlateCalc, setShowPlateCalc] = useState(false);
  const [showNote, setShowNote] = useState(false);
  const [dhikrIdx, setDhikrIdx] = useState(0);
  const restRef = useRef(null);
  const sessionRef = useRef(null);
  const dhikrRef = useRef(null);
  const displayedExercises = showAll ? allExercises : todaysPlan.map(e => e.name);

  const sessionActive = !!state.activeSessionStart;

  useEffect(() => {
    if (restLeft <= 0) { clearInterval(restRef.current); return; }
    restRef.current = setInterval(() => setRestLeft(r => {
      const next = Math.max(0, r - 1);
      if (next === 0) { buzz([120, 80, 120, 80, 200]); if (state.soundEnabled !== false) playBeep(); }
      return next;
    }), 1000);
    return () => clearInterval(restRef.current);
  }, [restLeft > 0]);

  useEffect(() => {
    if (!sessionActive) { clearInterval(sessionRef.current); setElapsed(0); return; }
    sessionRef.current = setInterval(() => setElapsed(Math.floor((Date.now() - state.activeSessionStart) / 1000)), 1000);
    return () => clearInterval(sessionRef.current);
  }, [sessionActive]);

  useEffect(() => {
    if (restLeft <= 0 || state.dhikrEnabled === false) { clearInterval(dhikrRef.current); return; }
    const start = Math.floor(Math.random() * DHIKR.length);
    setDhikrIdx(start);
    speak(DHIKR[start]);
    dhikrRef.current = setInterval(() => setDhikrIdx(i => { const n = (i + 1) % DHIKR.length; speak(DHIKR[n]); return n; }), 4000);
    return () => clearInterval(dhikrRef.current);
  }, [restLeft > 0]);

  const planEntry = todaysPlan.find(e => e.name === selected);
  const targetSets = planEntry ? planEntry.sets : 3;
  const targetReps = planEntry ? planEntry.reps : 10;
  const allSetsToday = state.logs.filter(l => l.date === today && l.exercise === selected).flatMap(l => l.sets);
  const setsToday = allSetsToday.filter(s => !s.warmup);
  const lastSession = state.logs.filter(l => l.exercise === selected && l.date !== today).sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const lastWorkingSets = lastSession ? lastSession.sets.filter(s => !s.warmup) : [];
  const lastTop = lastWorkingSets.length ? Math.max(...lastWorkingSets.map(s => s.weight)) : null;
  const lastTopSet = lastWorkingSets.length ? lastWorkingSets.reduce((a,b) => b.weight >= a.weight ? b : a) : null;
  const est1RM = lastTopSet ? Math.round(estOneRM(lastTopSet.weight, lastTopSet.reps) * 10) / 10 : null;
  const suggested = lastTopSet ? suggestNextWeight(lastTopSet.weight, lastTopSet.reps, targetReps) : null;

  useEffect(() => {
    setShowNote(false);
    setEditingIndex(null);
    setIsWarmup(false);
    if (allSetsToday.length === 0 && lastTopSet) {
      setWeightStr(String(suggested || lastTopSet.weight));
      setRepsStr(String(targetReps));
    } else {
      setWeightStr(""); setRepsStr("");
    }
    // eslint-disable-next-line
  }, [selected]);

  const startSession = () => persist({ ...state, activeSessionStart: Date.now() });
  const endSession = () => {
    const minutes = Math.max(1, Math.round((Date.now() - state.activeSessionStart) / 60000));
    persist({ ...state, activeSessionStart: null, sessionHistory: [...state.sessionHistory, { date: today, minutes }] });
    showToast("تمرين " + minutes + " دقيقة 🔥");
  };

  const addSet = () => {
    const w = parseFloat(weightStr), r = parseInt(repsStr, 10);
    if (!w || !r) return;
    const existing = state.logs.find(l => l.date === today && l.exercise === selected);

    if (editingIndex !== null) {
      const logs = state.logs.map(l => (l.date===today && l.exercise===selected) ? { ...l, sets: l.sets.map((s,i) => i===editingIndex ? { weight:w, reps:r, warmup:isWarmup } : s) } : l);
      persist({ ...state, logs });
      setEditingIndex(null);
      setWeightStr(""); setRepsStr(""); setIsWarmup(false);
      showToast("اتعدّل ✅");
      return;
    }

    const isPR = !isWarmup && lastTop != null && w > lastTop;
    let logs;
    if (existing) logs = state.logs.map(l => l === existing ? { ...l, sets: [...l.sets, { weight:w, reps:r, warmup:isWarmup }] } : l);
    else logs = [...state.logs, { id: Date.now(), date: today, exercise: selected, sets: [{ weight:w, reps:r, warmup:isWarmup }] }];
    persist({ ...state, logs });
    setRepsStr("");
    if (!isWarmup) {
      buzz(isPR ? [40,60,40,60,80] : 40);
      showToast(isPR ? "رقم قياسي جديد! 🏆" : pickHype());
      setRestLeft(restTotal);
      if (setsToday.length + 1 >= targetSets) setPrompt(true);
    } else {
      buzz(30);
      showToast("إحماء ✅");
      setRestLeft(Math.min(restTotal, 45));
    }
  };

  const startEditSet = (idx) => {
    const s = allSetsToday[idx];
    setWeightStr(String(s.weight));
    setRepsStr(String(s.reps));
    setIsWarmup(!!s.warmup);
    setEditingIndex(idx);
  };
  const cancelEdit = () => { setEditingIndex(null); setWeightStr(""); setRepsStr(""); setIsWarmup(false); };

  const fillLastSet = () => {
    const last = allSetsToday[allSetsToday.length - 1] || (lastSession ? lastSession.sets[lastSession.sets.length - 1] : null);
    if (!last) return;
    setWeightStr(String(last.weight));
    setRepsStr(String(last.reps));
  };

  const deleteSet = (idx) => {
    const logs = state.logs.map(l => (l.date===today && l.exercise===selected) ? { ...l, sets: l.sets.filter((_,i) => i!==idx) } : l).filter(l => !(l.date===today && l.exercise===selected && l.sets.length===0));
    persist({ ...state, logs });
  };

  const saveNote = (text) => {
    persist({ ...state, exerciseNotes: { ...state.exerciseNotes, [selected]: text } });
  };

  const moveToNext = () => {
    const idx = todaysPlan.findIndex(e => e.name === selected);
    setPrompt(false);
    if (idx >= 0 && idx < todaysPlan.length - 1) setSelected(todaysPlan[idx+1].name);
    else showToast("خلصت التمرين! 🎉");
  };

  const pct = restTotal ? restLeft/restTotal : 0;
  const circumference = 2*Math.PI*40;

  const exerciseStatus = {};
  displayedExercises.forEach(ex => {
    const planE = todaysPlan.find(e => e.name === ex);
    const target = planE ? planE.sets : null;
    const done = state.logs.filter(l => l.date === today && l.exercise === ex).flatMap(l => l.sets).filter(s => !s.warmup).length;
    exerciseStatus[ex] = { target, done, complete: target != null && done >= target };
  });
  const completedCount = todaysPlan.filter(e => exerciseStatus[e.name] && exerciseStatus[e.name].complete).length;

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
      <Card style={{ padding:14, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div>
          <div style={{ fontSize:12, color:C.textMuted }}>وقت التمرين</div>
          <div className="cairo" style={{ fontWeight:900, fontSize:20 }}>{fmtClock(elapsed)}</div>
        </div>
        {!sessionActive ? (
          <button onClick={startSession} className="cairo" style={{ padding:"8px 16px", borderRadius:12, background:C.gold, color:C.ink, fontWeight:700 }}>▶ ابدأ</button>
        ) : (
          <button onClick={endSession} className="cairo" style={{ padding:"8px 16px", borderRadius:12, background:C.rust, color:"#fff", fontWeight:700 }}>■ إنهاء</button>
        )}
      </Card>

      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div style={{ fontSize:12, color:C.textMuted }}>
          {showAll ? "كل التمارين" : "تمارين اليوم"}
          {!showAll && todaysPlan.length > 0 && <span className="cairo" style={{ color:C.gold, fontWeight:700 }}> ({completedCount}/{todaysPlan.length})</span>}
        </div>
        {todaysPlan.length > 0 && (
          <button onClick={() => setShowAll(s => !s)} className="cairo" style={{ fontSize:12, fontWeight:700, color:C.gold, background:"transparent" }}>
            {showAll ? "رجّع لتمارين اليوم" : "عايز تمرين تاني؟"}
          </button>
        )}
      </div>
      <div style={{ display:"flex", gap:10, overflowX:"auto", paddingBottom:4 }}>
        {displayedExercises.map(ex => {
          const st = exerciseStatus[ex];
          return (
          <button key={ex} onClick={() => { setSelected(ex); setPrompt(false); }} style={{ position:"relative", display:"flex", flexDirection:"column", alignItems:"center", gap:6, flexShrink:0, padding:"10px 12px", borderRadius:12, minWidth:76, background: selected===ex?C.gold:C.surface, border:"2px solid "+(selected===ex?C.gold:(st && st.complete ? "#4A7A5A" : C.border)), opacity: st && st.complete && selected!==ex ? 0.65 : 1 }}>
            {st && st.complete && <span style={{ position:"absolute", top:-6, left:-6, background:"#4A7A5A", color:"#fff", borderRadius:999, width:18, height:18, fontSize:11, display:"flex", alignItems:"center", justifyContent:"center" }}>✓</span>}
            <ExerciseIcon name={ex} size={36} color={selected===ex?C.ink:C.text} />
            <span style={{ fontSize:11, textAlign:"center", lineHeight:1.2, color: selected===ex?C.ink:C.textMuted }}>{ex}</span>
            {st && st.target != null && !st.complete && st.done > 0 && (
              <span className="cairo" style={{ fontSize:10, fontWeight:700, color: selected===ex?C.ink:C.gold }}>{st.done}/{st.target}</span>
            )}
          </button>
        );})}
      </div>

      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
        {lastTop ? (
          <div style={{ fontSize:12, color:C.textMuted }}>آخر مرة: أعلى وزن <span className="cairo" style={{ fontWeight:700, color:C.gold }}>{lastTop} كجم</span></div>
        ) : <div />}
        <button onClick={() => setShowNote(s => !s)} className="cairo" style={{ fontSize:12, fontWeight:700, color: state.exerciseNotes[selected] ? C.gold : C.textMuted, background:"transparent" }}>
          📝 {state.exerciseNotes[selected] ? "ملاحظة محفوظة" : "ضيف ملاحظة"}
        </button>
      </div>

      {showNote && <ExerciseNote key={selected} value={state.exerciseNotes[selected] || ""} onSave={(t) => { saveNote(t); setShowNote(false); showToast("اتحفظت الملاحظة 📝"); }} />}

      {est1RM && (
        <Card style={{ padding:14, display:"flex", justifyContent:"space-around", textAlign:"center" }}>
          <div>
            <div style={{ fontSize:10, color:C.textMuted }}>أقصى وزن تقديري (1RM)</div>
            <div className="cairo" style={{ fontWeight:900, fontSize:18, color:C.gold, marginTop:2 }}>{est1RM} كجم</div>
          </div>
          <div style={{ width:1, background:C.border }} />
          <div>
            <div style={{ fontSize:10, color:C.textMuted }}>جرّب النهاردة</div>
            <div className="cairo" style={{ fontWeight:900, fontSize:18, marginTop:2 }}>{suggested} كجم</div>
          </div>
        </Card>
      )}

      {prompt && (
        <Card style={{ padding:16, textAlign:"center", border:"1px solid "+C.gold, background:C.surfaceAlt }}>
          <div className="cairo" style={{ fontWeight:700, fontSize:14, marginBottom:12 }}>خلصت {targetSets} سيتات المطلوبة! عايز تعمل إيه؟</div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={() => setPrompt(false)} className="cairo" style={{ flex:1, padding:"10px 0", borderRadius:12, fontSize:14, fontWeight:700, background:C.surface, border:"1px solid "+C.border, color:C.text }}>سيت زيادة</button>
            <button onClick={moveToNext} className="cairo" style={{ flex:1, padding:"10px 0", borderRadius:12, fontSize:14, fontWeight:700, background:C.gold, color:C.ink }}>التمرين اللي بعده</button>
          </div>
        </Card>
      )}

      {restLeft > 0 && (
        <Card style={{ padding:16, display:"flex", flexDirection:"column", alignItems:"center" }}>
          <div style={{ position:"relative", width:96, height:96 }}>
            <svg width="96" height="96" style={{ transform:"rotate(-90deg)" }}>
              <circle cx="48" cy="48" r="40" fill="none" stroke={C.surfaceAlt} strokeWidth="7" />
              <circle cx="48" cy="48" r="40" fill="none" stroke={C.gold} strokeWidth="7" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={circumference*(1-pct)} style={{ transition:"stroke-dashoffset 1s linear" }} />
            </svg>
            <div className="cairo" style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:900, fontSize:20 }}>{restLeft}</div>
          </div>
          <div style={{ fontSize:12, color:C.textMuted, marginTop:8, marginBottom:4 }}>راحة قبل السيت الجاي</div>
          {state.dhikrEnabled !== false && (
            <div className="cairo" style={{ fontSize:14, fontWeight:700, color:C.gold, marginBottom:12, minHeight:20 }}>
              {DHIKR[dhikrIdx % DHIKR.length]}
            </div>
          )}
          <div style={{ display:"flex", gap:8, width:"100%" }}>
            <button onClick={() => setRestLeft(r => r + 15)} className="cairo" style={{ flex:1, padding:"8px 0", borderRadius:10, background:C.surfaceAlt, border:"1px solid "+C.border, fontSize:13, fontWeight:700 }}>+١٥ث</button>
            <button onClick={() => setRestLeft(0)} className="cairo" style={{ flex:1, padding:"8px 0", borderRadius:10, background:"transparent", border:"1px solid "+C.rust, color:C.rust, fontSize:13, fontWeight:700 }}>تخطّي الراحة</button>
          </div>
        </Card>
      )}

      <Card style={{ padding:16 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
          <div style={{ fontSize:12, color:C.textMuted }}>سجّل السيت</div>
          <div style={{ display:"flex", gap:12, alignItems:"center" }}>
            <button onClick={() => setShowPlateCalc(true)} style={{ fontSize:16, background:"transparent" }} title="حاسبة الأطباق">🧮</button>
            {(allSetsToday.length > 0 || lastSession) && (
              <button onClick={fillLastSet} className="cairo" style={{ fontSize:12, fontWeight:700, color:C.gold, background:"transparent" }}>زي آخر مرة ↺</button>
            )}
          </div>
        </div>
        <div style={{ display:"flex", gap:8, marginBottom:12 }}>
          <button onClick={() => setIsWarmup(false)} className="cairo" style={{ flex:1, padding:"8px 0", borderRadius:10, fontWeight:700, fontSize:13, background: !isWarmup?C.gold:C.surfaceAlt, color: !isWarmup?C.ink:C.textMuted, border:"1px solid "+(!isWarmup?C.gold:C.border) }}>سيت شغل 💪</button>
          <button onClick={() => setIsWarmup(true)} className="cairo" style={{ flex:1, padding:"8px 0", borderRadius:10, fontWeight:700, fontSize:13, background: isWarmup?C.gold:C.surfaceAlt, color: isWarmup?C.ink:C.textMuted, border:"1px solid "+(isWarmup?C.gold:C.border) }}>إحماء 🌡️</button>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 }}>
          <div style={{ borderRadius:12, padding:"12px 0", textAlign:"center", background:C.surfaceAlt }}>
            <div style={{ fontSize:10, color:C.textMuted }}>الوزن (كجم)</div>
            <div className="cairo" style={{ fontWeight:900, fontSize:22 }}>{weightStr || "٠"}</div>
          </div>
          <div style={{ borderRadius:12, padding:"12px 0", textAlign:"center", background:C.surfaceAlt }}>
            <div style={{ fontSize:10, color:C.textMuted }}>العدات</div>
            <div className="cairo" style={{ fontWeight:900, fontSize:22 }}>{repsStr || "٠"}</div>
          </div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <NumPad value={weightStr} onChange={setWeightStr} allowDot={true} />
          <NumPad value={repsStr} onChange={setRepsStr} allowDot={false} />
        </div>
        <button onClick={addSet} className="cairo" style={{ width:"100%", padding:"12px 0", borderRadius:12, marginTop:12, background:C.gold, color:C.ink, fontWeight:700, fontSize:15 }}>
          {editingIndex !== null ? "✓ حفظ التعديل" : "✓ سجّل السيت"}
        </button>
        {editingIndex !== null && (
          <button onClick={cancelEdit} className="cairo" style={{ width:"100%", padding:"8px 0", marginTop:8, background:"transparent", color:C.textMuted, fontSize:13 }}>إلغاء التعديل</button>
        )}
      </Card>

      {allSetsToday.length > 0 && (
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          <div style={{ fontSize:12, color:C.textMuted }}>سيتات النهاردة ({setsToday.length}/{targetSets}) — دوس على أي سيت تعدّله</div>
          {allSetsToday.map((s,i) => (
            <div key={i} onClick={() => startEditSet(i)} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 16px", borderRadius:12, background: editingIndex===i?C.surfaceAlt:C.surface, border:"1px solid "+(editingIndex===i?C.gold:(s.warmup?C.border:C.border)) }}>
              <span style={{ fontSize:14, display:"flex", alignItems:"center", gap:6 }}>
                سيت {i+1}
                {s.warmup && <span style={{ fontSize:10, padding:"1px 7px", borderRadius:999, background:C.surfaceAlt, color:C.textMuted }}>إحماء</span>}
              </span>
              <span className="cairo" style={{ fontWeight:700, fontSize:14 }}>{s.weight} كجم × {s.reps}</span>
              <button onClick={(e) => { e.stopPropagation(); deleteSet(i); if (editingIndex===i) cancelEdit(); }} style={{ background:"transparent", color:C.rust, fontSize:16 }}>🗑</button>
            </div>
          ))}
        </div>
      )}
      {showPlateCalc && <PlateCalcModal initialWeight={weightStr} onClose={() => setShowPlateCalc(false)} />}
    </div>
  );
}

function HistoryTab({ state }) {
  const byDate = {};
  state.logs.forEach(l => {
    if (!byDate[l.date]) byDate[l.date] = [];
    byDate[l.date].push(l);
  });
  const dates = Object.keys(byDate).sort((a,b) => a < b ? 1 : -1);
  const sessionsByDate = {};
  state.sessionHistory.forEach(s => { sessionsByDate[s.date] = s.minutes; });

  if (dates.length === 0) {
    return <div style={{ fontSize:14, textAlign:"center", padding:"48px 0", color:C.textMuted }}>لسه مفيش تمارين مسجلة. سجّل أول سيت من تاب "تمرين" 💪</div>;
  }

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
      {dates.map(date => {
        const dObj = new Date(date + "T00:00:00");
        const label = DAYS[dObj.getDay()] + " " + dObj.getDate() + "/" + (dObj.getMonth()+1);
        const totalVolume = byDate[date].reduce((sum,l) => sum + l.sets.reduce((s,x) => s + x.weight*x.reps, 0), 0);
        return (
          <Card key={date} style={{ padding:16 }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
              <div className="cairo" style={{ fontWeight:700, fontSize:14 }}>{label}</div>
              <div style={{ fontSize:11, color:C.textMuted }}>
                {sessionsByDate[date] ? sessionsByDate[date] + " د · " : ""}{Math.round(totalVolume).toLocaleString("ar-EG")} كجم حجم
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {byDate[date].map(l => (
                <div key={l.id} style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <ExerciseIcon name={l.exercise} size={22} color={C.textMuted} />
                  <div style={{ flex:1, fontSize:13 }}>{l.exercise}</div>
                  <div style={{ fontSize:12, color:C.textMuted }}>{l.sets.map(s => s.weight+"×"+s.reps).join(" · ")}</div>
                </div>
              ))}
            </div>
          </Card>
        );
      })}
    </div>
  );
}

function PlanTab({ state, persist, allExercises }) {
  const [customEx, setCustomEx] = useState("");
  const applyProgram = (p) => persist({ ...state, plan: p.plan, programId: p.id });
  const toggleExercise = (dayIdx, name) => {
    const current = state.plan[dayIdx] || [];
    const has = current.some(e => e.name === name);
    const next = has ? current.filter(e => e.name !== name) : [...current, { name, sets:3, reps:10 }];
    persist({ ...state, plan: { ...state.plan, [dayIdx]: next } });
  };
  const updateTarget = (dayIdx, name, field, delta) => {
    const current = state.plan[dayIdx] || [];
    const next = current.map(e => e.name===name ? { ...e, [field]: Math.max(1, (e[field]||0) + delta) } : e);
    persist({ ...state, plan: { ...state.plan, [dayIdx]: next } });
  };
  const addCustomExercise = () => {
    if (!customEx.trim()) return;
    persist({ ...state, customExercises: [...state.customExercises, customEx.trim()] });
    setCustomEx("");
  };
  const removeCustomExercise = (name) => {
    const nextPlan = {};
    Object.keys(state.plan).forEach(k => { nextPlan[k] = (state.plan[k]||[]).filter(e => e.name !== name); });
    persist({ ...state, customExercises: state.customExercises.filter(e => e !== name), plan: nextPlan });
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
      <div>
        <div className="cairo" style={{ fontWeight:700, fontSize:14, marginBottom:8, color:C.gold }}>برامج جاهزة</div>
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {PROGRAMS.map(p => (
            <button key={p.id} onClick={() => applyProgram(p)} style={{ textAlign:"right", borderRadius:16, padding:16, background: state.programId===p.id?C.surfaceAlt:C.surface, border:"1px solid "+(state.programId===p.id?C.gold:C.border) }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <span className="cairo" style={{ fontWeight:700, fontSize:14 }}>{p.name}</span>
                {state.programId===p.id && <span style={{ fontSize:11, padding:"2px 8px", borderRadius:999, background:C.gold, color:C.ink }}>مفعّل</span>}
              </div>
              <div style={{ fontSize:12, color:C.textMuted, marginTop:4 }}>{p.desc}</div>
            </button>
          ))}
        </div>
      </div>

      <div>
        <div className="cairo" style={{ fontWeight:700, fontSize:14, marginBottom:8, color:C.gold }}>تمرين مخصص</div>
        <div style={{ display:"flex", gap:8 }}>
          <input value={customEx} onChange={e => setCustomEx(e.target.value)} placeholder="اسم التمرين" style={{ flex:1, borderRadius:8, padding:"8px 12px", fontSize:14, background:C.surface, color:C.text, border:"1px solid "+C.border }} />
          <button onClick={addCustomExercise} style={{ padding:"0 16px", borderRadius:8, background:C.gold, color:C.ink, fontSize:16 }}>+</button>
        </div>
        {state.customExercises.length > 0 && (
          <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:10 }}>
            {state.customExercises.map(ex => (
              <div key={ex} style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, padding:"6px 10px", borderRadius:999, background:C.surface, border:"1px solid "+C.border }}>
                {ex}
                <button onClick={() => removeCustomExercise(ex)} style={{ background:"transparent", color:C.rust, fontSize:13 }}>✕</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <div className="cairo" style={{ fontWeight:700, fontSize:14, marginBottom:8, color:C.gold }}>خطة الأسبوع (عدّل يدويًا)</div>
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          {DAYS.map((dayName, idx) => {
            const dayPlan = state.plan[idx] || [];
            return (
            <Card key={idx} style={{ padding:14 }}>
              <div className="cairo" style={{ fontSize:14, fontWeight:700, marginBottom:10 }}>{dayName}</div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom: dayPlan.length ? 12 : 0 }}>
                {allExercises.map(ex => {
                  const active = dayPlan.some(e => e.name === ex);
                  return (
                    <button key={ex} onClick={() => toggleExercise(idx, ex)} style={{ display:"flex", alignItems:"center", gap:4, fontSize:12, padding:"6px 10px", borderRadius:999, background: active?C.gold:C.surfaceAlt, color: active?C.ink:C.textMuted, border:"1px solid "+(active?C.gold:C.border) }}>
                      <ExerciseIcon name={ex} size={14} color={active?C.ink:C.textMuted} />{ex}
                    </button>
                  );
                })}
              </div>
              {dayPlan.length > 0 && (
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {dayPlan.map(e => (
                    <div key={e.name} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 10px", borderRadius:10, background:C.surfaceAlt }}>
                      <div style={{ flex:1, fontSize:12 }}>{e.name}</div>
                      <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                        <button onClick={() => updateTarget(idx, e.name, "sets", -1)} style={{ width:22, height:22, borderRadius:6, background:C.surface, color:C.text, fontSize:13, border:"1px solid "+C.border }}>−</button>
                        <span className="cairo" style={{ fontSize:12, fontWeight:700, minWidth:38, textAlign:"center" }}>{e.sets} سيت</span>
                        <button onClick={() => updateTarget(idx, e.name, "sets", 1)} style={{ width:22, height:22, borderRadius:6, background:C.surface, color:C.text, fontSize:13, border:"1px solid "+C.border }}>+</button>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                        <button onClick={() => updateTarget(idx, e.name, "reps", -1)} style={{ width:22, height:22, borderRadius:6, background:C.surface, color:C.text, fontSize:13, border:"1px solid "+C.border }}>−</button>
                        <span className="cairo" style={{ fontSize:12, fontWeight:700, minWidth:42, textAlign:"center" }}>{e.reps} عدة</span>
                        <button onClick={() => updateTarget(idx, e.name, "reps", 1)} style={{ width:22, height:22, borderRadius:6, background:C.surface, color:C.text, fontSize:13, border:"1px solid "+C.border }}>+</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          );})}
        </div>
      </div>
    </div>
  );
}

function MiniLineChart({ data }) {
  const w = 320, h = 160, pad = 28;
  const weights = data.map(d => d.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const range = (max - min) || 1;
  const stepX = data.length > 1 ? (w - 2*pad) / (data.length - 1) : 0;
  const points = data.map((d,i) => ({
    x: pad + i*stepX,
    y: h - pad - ((d.weight - min) / range) * (h - 2*pad),
    ...d,
  }));
  const pathD = points.map((p,i) => (i===0?"M":"L") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
  return (
    <svg width="100%" height={h} viewBox={"0 0 "+w+" "+h}>
      <line x1={pad} y1={h-pad} x2={w-pad} y2={h-pad} stroke={C.border} strokeWidth="1" />
      <path d={pathD} fill="none" stroke={C.gold} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p,i) => <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={C.gold} />)}
      <text x={pad} y={h-8} fontSize="10" fill={C.textMuted}>{points[0].date}</text>
      <text x={w-pad} y={h-8} fontSize="10" fill={C.textMuted} textAnchor="end">{points[points.length-1].date}</text>
      <text x={pad} y="14" fontSize="10" fill={C.textMuted}>{max} كجم</text>
    </svg>
  );
}

function ProgressTab({ state, allExercises, persist }) {
  const [selected, setSelected] = useState(allExercises[0] || "");
  const [bwInput, setBwInput] = useState("");
  const today = todayKey();
  const data = state.logs.filter(l => l.exercise === selected).sort((a,b) => a.date > b.date ? 1 : -1).map(l => ({ date: l.date.slice(5), weight: Math.max(...l.sets.map(s => s.weight)) }));
  const days = Array.from({ length: 28 }).map((_, i) => addDays(today, i - 27));
  const logDates = new Set(state.logs.map(l => l.date));
  const bodyWeights = (state.bodyWeights || []).slice().sort((a,b) => a.date > b.date ? 1 : -1);
  const bwChartData = bodyWeights.map(b => ({ date: b.date.slice(5), weight: b.weight }));
  const latestBw = bodyWeights[bodyWeights.length - 1];

  const addBodyWeight = () => {
    const w = parseFloat(bwInput);
    if (!w) return;
    const existing = (state.bodyWeights || []).find(b => b.date === today);
    let bodyWeightsNext;
    if (existing) bodyWeightsNext = state.bodyWeights.map(b => b.date === today ? { date: today, weight: w } : b);
    else bodyWeightsNext = [...(state.bodyWeights || []), { date: today, weight: w }];
    persist({ ...state, bodyWeights: bodyWeightsNext });
    setBwInput("");
  };

  const records = allExercises.map(ex => {
    const logsForEx = state.logs.filter(l => l.exercise === ex);
    if (logsForEx.length === 0) return null;
    let best = { weight: 0, date: null };
    logsForEx.forEach(l => l.sets.forEach(s => { if (s.weight > best.weight) best = { weight: s.weight, date: l.date }; }));
    return { ex, ...best };
  }).filter(Boolean).sort((a,b) => b.weight - a.weight);

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
      <div>
        <div className="cairo" style={{ fontSize:14, fontWeight:700, color:C.gold, marginBottom:8 }}>⚖️ وزن جسمك</div>
        <Card style={{ padding:16 }}>
          <div style={{ display:"flex", gap:8, marginBottom: bwChartData.length >= 2 ? 12 : 0 }}>
            <input value={bwInput} onChange={e => setBwInput(e.target.value)} type="number" inputMode="decimal" placeholder={latestBw ? "آخر وزن: "+latestBw.weight+" كجم" : "وزنك النهاردة (كجم)"} style={{ flex:1, borderRadius:10, padding:"10px 12px", fontSize:14, background:C.surfaceAlt, color:C.text, border:"1px solid "+C.border }} />
            <button onClick={addBodyWeight} className="cairo" style={{ padding:"0 18px", borderRadius:10, background:C.gold, color:C.ink, fontWeight:700 }}>حفظ</button>
          </div>
          {bwChartData.length >= 2 && <MiniLineChart data={bwChartData} />}
        </Card>
      </div>
      {records.length > 0 && (
        <div>
          <div className="cairo" style={{ fontSize:14, fontWeight:700, color:C.gold, marginBottom:8 }}>🏆 أرقامك القياسية</div>
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {records.map(r => (
              <div key={r.ex} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 12px", borderRadius:12, background:C.surface, border:"1px solid "+C.border }}>
                <ExerciseIcon name={r.ex} size={22} color={C.textMuted} />
                <span style={{ flex:1, fontSize:13 }}>{r.ex}</span>
                <span className="cairo" style={{ fontWeight:900, fontSize:14, color:C.gold }}>{r.weight} كجم</span>
              </div>
            ))}
          </div>
        </div>
      )}
      <div style={{ display:"flex", gap:10, overflowX:"auto", paddingBottom:4 }}>
        {allExercises.map(ex => (
          <button key={ex} onClick={() => setSelected(ex)} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:6, flexShrink:0, padding:"10px 12px", borderRadius:12, minWidth:76, background: selected===ex?C.gold:C.surface, border:"2px solid "+(selected===ex?C.gold:C.border) }}>
            <ExerciseIcon name={ex} size={34} color={selected===ex?C.ink:C.text} />
            <span style={{ fontSize:11, textAlign:"center", lineHeight:1.2, color: selected===ex?C.ink:C.textMuted }}>{ex}</span>
          </button>
        ))}
      </div>
      <Card style={{ padding:16 }}>
        {data.length < 2 ? (
          <div style={{ fontSize:14, textAlign:"center", padding:"32px 0", color:C.textMuted }}>سجّل التمرين ده أكتر من مرة عشان تشوف تقدمك</div>
        ) : <MiniLineChart data={data} />}
      </Card>
      <div>
        <div style={{ fontSize:12, color:C.textMuted, marginBottom:8 }}>آخر ٢٨ يوم</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:6 }}>
          {days.map(d => <div key={d} style={{ aspectRatio:"1", borderRadius:4, background: logDates.has(d)?C.gold:C.surfaceAlt }} />)}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
window.__aashLoaded = true;
setTimeout(() => {
  const s = document.getElementById("splash");
  if (s) { s.classList.add("hide"); setTimeout(() => s.remove(), 600); }
}, 900);
</script>

<script>
  // شبكة أمان: لو محمّل المكتبات فشل في كل المصادر (unpkg وjsDelivr) قبل ما
  // React يخلص تحميله، السبلاش هيفضل عالق للأبد من غير الكود ده. بنستنى لحد
  // 40 ثانية (وقت كافي للمحمّل يجرب المصادر البديلة كلها)، وبنقفل بدري لو
  // حصل خطأ واضح، وبعدين بنورّي رسالة واضحة بدل ما نسيب المستخدم يتفرج على شاشة فاضية.
  let aashWaited = 0;
  const aashWatcher = setInterval(() => {
    aashWaited += 500;
    if (window.__aashLoaded || (window.__aashLoadError && aashWaited < 500)) {
      // لسه محتاجين نستنى شوية إضافية حتى لو حصل error، بس لو loaded خلاص وقفنا فورًا
    }
    const shouldShow = window.__aashLoaded ? false : (window.__aashLoadError || aashWaited >= 40000);
    if (shouldShow) {
      clearInterval(aashWatcher);
      const s = document.getElementById("splash");
      if (s && !s.classList.contains("hide")) {
        s.innerHTML =
          '<div style="text-align:center;padding:24px;color:#E0AC4F;font-family:Cairo,sans-serif">' +
          '<div style="font-size:18px;font-weight:900;margin-bottom:10px">في مشكلة في تحميل التطبيق</div>' +
          '<div style="font-size:14px;color:#A39A8B;margin-bottom:18px">اتأكد إنك متصل بالنت أول مرة تفتح فيها التطبيق، وبعدين جرب تاني</div>' +
          '<button onclick="location.reload()" style="background:#E0AC4F;color:#141210;border:none;border-radius:10px;padding:10px 24px;font-weight:900;font-family:Cairo,sans-serif;font-size:14px">إعادة المحاولة</button>' +
          '</div>';
      }
    } else if (window.__aashLoaded) {
      clearInterval(aashWatcher);
    }
  }, 500);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
